version: "1.0"
pipeline_name: "estudio_integral_remates"

primary_source:
  plugin: "remaju"
  extraction_keys:
    partidaRegistral: "detalle.inmuebles.0.partidaRegistral"
    expediente: "detalle.expediente"
  parameters:
    headless: false
    limite_items: 2

enrichments:
  - plugin: "sunarp"
    cardinality: "one-to-many"
    match_with: "partidaRegistral"
    param_name: "partida_objetivo"
    parameters:
      headless: false
      estrategia_sesion: "persistente_con_retroceso"
     

target:
  output_dir: "./salida_unificada"