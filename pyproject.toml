[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "chaskywasi"  # <-- Cambiado al nombre real de tu librería
version = "0.1.1"
description = "Una descripción corta y clara de tu librería en Python."
readme = "README.md"
authors = [
    { name = "Tu Nombre", email = "tu.correo@ejemplo.com" }
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = [
    "docling>=2.0.0",
    "tiktoken>=0.7.0",
    "chromadb>=0.5.0",
    "ijson>=3.3.0",
    "requests>=2.32.0",
    "streamlit>=1.30.0",
    "google-genai>=0.1.0",
    "httpx>=0.27.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "anyio>=4.0.0",
    "faker>=20.0.0"
]

[project.urls]
Homepage = "https://github.com/Maorda/chaskywasi"
Issues = "https://github.com/Maorda/chaskywasi/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/chaskiwasi"]