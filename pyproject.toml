[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "mi-libreria-nombre"  # Cambia por el nombre único de tu librería en PyPI
version = "0.1.0"
description = "Una descripción corta y clara de tu librería en Python."
readme = "README.md"
authors = [
    { name = "Tu Nombre", email = "tu.correo@ejemplo.com" }
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.8"
dependencies = [
    # Agrega aquí las dependencias externas que requiera tu librería (ej: "requests>=2.28.0")
]

[project.urls]
Homepage = "https://github.com/tu-usuario/mi-libreria-nombre"
Issues = "https://github.com/tu-usuario/mi-libreria-nombre/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/chaskiwasi/*"]  # Cambia por la ruta donde esté el código fuente de tu librería