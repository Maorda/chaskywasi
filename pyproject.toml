[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "chaskywasi"  # <-- Cambiado al nombre real de tu librería
version = "0.1.0"
description = "Una descripción corta y clara de tu librería en Python."
readme = "README.md"
authors = [
    { name = "Tu Nombre", email = "tu.correo@ejemplo.com" }
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.8"
dependencies = [
    # Agrega aquí tus dependencias si las necesitas
]

[project.urls]
Homepage = "https://github.com/Maorda/chaskywasi"  # <-- Actualizado con tu usuario de Git visible en consola
Issues = "https://github.com/Maorda/chaskywasi/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/chaskywasi"]  # <-- Asegura que coincida con la carpeta dentro de src/