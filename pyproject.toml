[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "chaskiwasi"  # <-- Cambiado al nombre real de tu librería
version = "0.2.1"
description = "Sistema de consulta semántica para fuentes jurídicas."
readme = "README.md"
authors = [
    { name = "Luis Maurtua", email = "luis.maurtua@ejemplo.com" }
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = [
    "chaskitambo>=0.1.0",
    "docling>=2.0.0",
    "tiktoken>=0.7.0",
    "chromadb>=0.5.0",
    "ijson>=3.3.0",
    "requests>=2.32.0",
    "streamlit>=1.30.0",
    "google-genai>=0.1.0",
    "httpx>=0.27.0",
    "typer>=0.9.0",
    "rich>=13.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "anyio>=4.0.0",
    "faker>=20.0.0"
]

[project.urls]
Homepage = "https://github.com/Maorda/chaskywasi"
Issues = "https://github.com/Maorda/chaskywasi/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/chaskiwasi"]

# REEMPLAZA EL BLOQUE ANTERIOR POR ESTE CON LA RUTA INTERNA REAL:
[project.entry-points."chaskywasi.taxonomy"]
taxonomia_oficial = "chaskiwasi.config.mis_taxonomias:cargar_taxonomia_peru"

[project.scripts]
chaskiwasi = "chaskiwasi.cli:app"


